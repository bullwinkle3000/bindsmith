[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bindsmith"
version = "0.1.0"
description = "Port and audit Elite Dangerous controller bindings across machines and hardware"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Andrew Langton" }]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.scripts]
bindsmith = "bindsmith.cli:main"

# The engine is standard-library only. The web layer (bindsmith serve) is the
# one optional extra; install with:  pip install -e ".[web]"
[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
